name: Held-out reconnaissance evaluation
on:
  pull_request:
    paths:
      - 'scripts/held-out-*.mjs'
      - 'scripts/run-held-out.mjs'
      - 'tests/held-out-evaluation.test.mjs'
      - 'agents/evaluation/*.json'
      - '.github/workflows/held-out-reconnaissance.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Quick screening or full 72-campaign evaluation (manual only)'
        required: true
        type: choice
        options: [smoke, full]
        default: smoke
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/audit-held-out-manifest.mjs
      - run: node --test tests/held-out-evaluation.test.mjs
  campaigns:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.mode == 'full' && '[{"layout":"continents","seed":104729},{"layout":"islands","seed":104729},{"layout":"archipelago","seed":104729},{"layout":"continents","seed":130363},{"layout":"islands","seed":130363},{"layout":"archipelago","seed":130363}]' || '[{"layout":"continents","seed":104729}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build pinned revisions
        shell: bash
        run: |
          BASELINE_SHA=$(node -p "JSON.parse(require('fs').readFileSync('agents/evaluation/held-out-reconnaissance.json')).baselineSha")
          CANDIDATE_SHA=$(node -p "JSON.parse(require('fs').readFileSync('agents/evaluation/held-out-reconnaissance.json')).candidateSha")
          git worktree add /tmp/empirata-baseline "$BASELINE_SHA"
          git worktree add /tmp/empirata-candidate "$CANDIDATE_SHA"
          for directory in /tmp/empirata-baseline /tmp/empirata-candidate; do
            (cd "$directory" && npm install --no-audit --no-fund && npm run build)
          done
      - name: Run balanced campaign shard
        env:
          MAP_LAYOUT: ${{ matrix.layout }}
          MAP_SEED: ${{ matrix.seed }}
          EVALUATION_MODE: ${{ inputs.mode }}
        run: node scripts/run-held-out.mjs /tmp/empirata-baseline /tmp/empirata-candidate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: held-out-${{ matrix.layout }}-${{ matrix.seed }}-${{ github.sha }}
          path: held-out-results/
          if-no-files-found: error
          retention-days: 30
