name: Compare reconnaissance AI

# Modern-AI reconnaissance benchmark (~15 min). Modern AI strategy is frozen
# (AGENTS.md), so this no longer runs on every engine PR: it runs nightly on
# main, on demand, and on PRs that change the comparison itself.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
  pull_request:
    paths:
      - 'scripts/compare-reconnaissance.mjs'
      - 'scripts/compare-seeded-reconnaissance.mjs'
      - 'scripts/reconnaissance-fixture.mjs'
      - 'scripts/campaign-maps.mjs'
      - '.github/workflows/compare-reconnaissance.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: candidate
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build candidate
        working-directory: candidate
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Build pinned PR 50 baseline
        run: |
          git clone --no-checkout --shared candidate baseline
          git -C baseline checkout bc3b729649bf962a05cf3ad17d9b1603d6fbfc43
          cd baseline
          npm install --no-audit --no-fund
          npm run build
      - name: Validate seeded fixtures
        working-directory: candidate
        run: node --test tests/reconnaissance-fixture.test.mjs
      - name: Compare matched campaigns
        working-directory: candidate
        env:
          RECON_ROUNDS: '180'
        run: node scripts/compare-reconnaissance.mjs ../baseline/dist/engine/index.js dist/engine/index.js
      - name: Compare seeded scout scenarios
        working-directory: candidate
        run: node scripts/compare-seeded-reconnaissance.mjs ../baseline/dist/engine/index.js dist/engine/index.js
      - name: Upload comparative report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reconnaissance-comparison-${{ github.sha }}
          path: candidate/recon-results/
          if-no-files-found: warn
          retention-days: 21
