name: Verify and build Empirata

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: empirata-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify supported Node.js runtime
        run: node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Check verification policy
        run: node --test tests/ci-scope.test.mjs
      - name: Select verification scope
        id: scope
        run: node scripts/ci-scope.mjs
      - name: Test engine and coverage
        if: steps.scope.outputs.scope != 'focused'
        run: npm test
      - name: Build and test display changes
        if: steps.scope.outputs.scope == 'focused'
        run: |
          npm run build
          node --test tests/unit-names.test.mjs tests/presentation.test.mjs tests/ui-camera.test.mjs tests/ui-structure.test.mjs
      - name: Build standalone browser application
        run: node scripts/build-single-file.cjs
      - name: Smoke test the generated browser bundle
        run: node --test smoke/bundle.mjs smoke/observer-batching.mjs smoke/cvc-autoplay-classic.mjs smoke/ui-load.mjs
      - name: Preserve verified browser bundle
        uses: actions/upload-artifact@v7
        with:
          name: empirata-browser-${{ github.sha }}
          path: index.html
          retention-days: 14
      - name: Stage verified site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - name: Package verified site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Runs on main push only until browser-smoke proves stable (target: promote to PR gate after 10 clean runs).
  browser-smoke:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright and WebKit
        run: npx playwright install webkit --with-deps
      - name: Build
        run: npm run build
      - name: Browser smoke (observer)
        run: EMPIRATA_PLAYWRIGHT_MODULE=playwright node --test smoke/observer.mjs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, browser-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: empirata-pages
      cancel-in-progress: false
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
