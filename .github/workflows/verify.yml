name: Verify and build Empirata

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: empirata-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify supported Node.js runtime
        run: node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Test engine and coverage
        run: npm test
      - name: Build standalone browser application
        run: node scripts/build-single-file.cjs
      - name: Smoke test the generated browser bundle
        run: node --test smoke/bundle.mjs
      - name: Verify generated page is checked in
        run: |
          if ! git diff --exit-code -- index.html; then
            echo 'Generated index.html is stale. Run node scripts/build-single-file.cjs and commit the result.' >&2
            exit 1
          fi
