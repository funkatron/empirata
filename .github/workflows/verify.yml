name: Verify and build Empirata

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: empirata-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify supported Node.js runtime
        run: node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Test engine and coverage
        run: npm test
      - name: Build standalone browser application
        run: node scripts/build-single-file.cjs
      - name: Smoke test the generated browser bundle
        run: node --test smoke/bundle.mjs smoke/observer-batching.mjs
      - name: Preserve verified browser bundle
        uses: actions/upload-artifact@v4
        with:
          name: empirata-browser-${{ github.sha }}
          path: index.html
          retention-days: 14
      - name: Stage verified site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - name: Package verified site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: empirata-pages
      cancel-in-progress: false
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
