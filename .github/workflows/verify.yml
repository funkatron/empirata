name: Verify and build Empirata

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: empirata-verify-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify supported Node.js runtime
        run: node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Test engine and coverage
        run: npm test
      - name: Build standalone browser application
        run: node scripts/build-single-file.cjs
      - name: Smoke test the generated browser bundle
        run: node --test smoke/bundle.mjs
      - name: Publish bundled page to main
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build: refresh tested standalone browser page [skip ci]"
            git push
          fi
