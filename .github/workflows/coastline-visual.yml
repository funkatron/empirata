name: Optional coastline visual review

on:
  workflow_dispatch:
    inputs:
      ref_note:
        description: 'Optional note identifying the PR or map scenario being reviewed'
        required: false
        type: string

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/build-single-file.cjs
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture deterministic browser screenshots
        run: node scripts/coastline-screenshots.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: coastline-visual-review-${{ github.sha }}
          path: coastline-screenshots/
          retention-days: 14
